name: Skill Build and Release

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags:
      - 'lumecard-deck-builder-v*'
    paths:
      - 'skills/lumecard-deck-builder/**'
      - '.github/workflows/skill-release.yml'
      - 'shared/src/commonMain/kotlin/com/lumecard/shared/data/ExportManager.kt'
      - 'shared/src/desktopTest/kotlin/com/lumecard/shared/data/SkillImportContractTest.kt'
  pull_request:
    paths:
      - 'skills/lumecard-deck-builder/**'
      - '.github/workflows/skill-release.yml'
      - 'shared/src/commonMain/kotlin/com/lumecard/shared/data/ExportManager.kt'
      - 'shared/src/desktopTest/kotlin/com/lumecard/shared/data/SkillImportContractTest.kt'

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
      checksum: ${{ steps.metadata.outputs.checksum }}
      artifact: ${{ steps.metadata.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate version and release tag
        id: metadata
        working-directory: skills/lumecard-deck-builder
        env:
          EXPECTED_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/release_skill.py metadata --expected-tag "$EXPECTED_TAG" --github-output "$GITHUB_OUTPUT"

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skills/lumecard-deck-builder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional PDF test dependency
        run: python -m pip install "pypdf>=6,<7"
      - name: Run Skill tests including installers and PDF extraction
        env:
          # Avoid macOS /var -> /private/var aliases in symlink-target checks.
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

  app-contract:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate real builder output and invalid boundary cases
        run: python skills/lumecard-deck-builder/tests/write_contract_fixtures.py "$RUNNER_TEMP/skill-contract"
      - name: Verify with the application importer
        env:
          LUMECARD_SKILL_CONTRACT_DIR: ${{ runner.temp }}/skill-contract
        run: bash gradlew :shared:desktopTest --tests '*SkillImportContractTest' --no-daemon --console=plain

  build:
    needs: [prepare, test, app-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/lumecard-deck-builder
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build ZIP and SHA256 from SKILL.md version
        env:
          EXPECTED_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/release_skill.py build --output-dir dist --expected-tag "$EXPECTED_TAG"
      - name: Verify checksum
        working-directory: skills/lumecard-deck-builder/dist
        env:
          CHECKSUM: ${{ needs.prepare.outputs.checksum }}
        run: sha256sum --check "$CHECKSUM"
      - name: Upload Skill distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: |
            skills/lumecard-deck-builder/dist/${{ needs.prepare.outputs.archive }}
            skills/lumecard-deck-builder/dist/${{ needs.prepare.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lumecard-deck-builder-v')
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: skill-dist
      - name: Verify and publish independent Skill release
        working-directory: skill-dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCHIVE: ${{ needs.prepare.outputs.archive }}
          CHECKSUM: ${{ needs.prepare.outputs.checksum }}
        run: |
          sha256sum --check "$CHECKSUM"
          gh release create "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" \
            --verify-tag --latest=false \
            --title "lumecard-deck-builder $VERSION" \
            --notes "Portable Agent Skill package with installation guide. Download the ZIP and its SHA256 checksum. Skill releases are versioned independently of the LumeCard application."
